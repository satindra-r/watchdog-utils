[package]
name = "watchdog_utils_II"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/satindra-r/watchdog-utils"
description = "Library for user management for scout and watchdog"
license = "MIT"


[dependencies]
anyhow = "1.0.97"
base64 = "0.22.1"
regex = "1.11.1"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
log = "0.4"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
dotenvy = "0.15.7"
